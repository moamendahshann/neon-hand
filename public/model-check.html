<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>فحص نموذج اليد</title><body style="background:#101510;color:#baff90;font:20px sans-serif;padding:40px"><h1>فحص نموذج اليد المحلي</h1><p id="result">جارٍ تحميل النموذج…</p><script>
const worker=new Worker('/tracker.js');const result=document.querySelector('#result');const timer=setTimeout(()=>{result.textContent='FAIL: timeout';worker.terminate()},45000);
worker.onerror=e=>{clearTimeout(timer);result.textContent='FAIL: '+e.message};
worker.onmessage=async({data})=>{if(data.type==='error'){clearTimeout(timer);result.textContent='FAIL: '+data.message;worker.terminate()}if(data.type==='ready'){result.textContent='تم تحميل النموذج. جارٍ اختبار الاستدلال…';const canvas=new OffscreenCanvas(640,480);canvas.getContext('2d').fillRect(0,0,640,480);const bitmap=canvas.transferToImageBitmap();worker.postMessage({type:'frame',bitmap,time:performance.now()},[bitmap])}if(data.type==='result'){clearTimeout(timer);result.textContent='PASS: تم تحميل النموذج وWASM محليًا وتنفيذ استدلال على إطار اصطناعي دون يد. '+data.delegate+' / '+Math.round(data.duration)+' ms';worker.terminate()}};worker.postMessage({type:'init'});
</script></body></html>
